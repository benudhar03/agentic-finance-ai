server:
  port: 9090
spring:
  application:
    name: Agentic-Finance-AI
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    url: jdbc:postgresql://localhost:5432/finance
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:P@ssw0rd}
  jpa:
    hibernate:
      ddl-auto: update   # validate/update use migrations (Flyway/Liquibase) in real projects, not auto-DDL
    open-in-view: false     # avoid lazy-loading surprises outside transactions
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.3
      embedding:
        options:
          model: text-embedding-3-small
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 1536
    mcp:
      server:
        name: Agentic-Finance-AI
        version: 1.0.0
        protocol: STREAMABLE
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://accounts.google.com
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      enable-idempotence: true
      retries: 3
      properties:
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000
        linger.ms: 5
        batch.size: 16384
        compression.type: snappy
    consumer:
      group-id: finance-ai-service-ingestion
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false

      max-poll-records: 500
      max-poll-interval-ms: 300000
      fetch-min-bytes: 1
      fetch-max-wait-ms: 500
      properties:
        spring.json.trusted.packages: "com.finance.ai.events"
        spring.json.value.default.type: com.finance.ai.events.DocumentUploadedEvent
    listener:
      ack-mode: manual_immediate

info:
  app:
    name: Agentic Finance AI
    description: AI-powered financial intelligence and agent service
    version: 0.0.1-SNAPSHOT

logging:
  level:
    com.finance.ai: DEBUG

app:
  security:
    google-client-id: ${GOOGLE_CLIENT_ID}
    audit-encryption-key: ${AUDIT_ENCRYPTION_KEY}
  ai:
    system-prompt: >
      You are a knowledgeable financial assistant for a finance application.
      Provide clear, accurate, and educational information on personal finance,
      investing concepts, budgeting, and markets. You do not provide personalized
      investment, tax, or legal advice, and you do not execute trades or access
      account data. When a question requires licensed professional advice,
      say so and recommend the user consult a qualified advisor. Be concise,
      avoid speculation, and never fabricate financial figures or facts.
  ingestion:
    topic: document-uploaded
    dlt-topic: document-uploaded.DLT
    max-retry-attempts: 4
    retry-multiplier: 2.0
    retry-backoff-ms: 2000
    publish-timeout-ms: 10000
    retry-initial-delay-ms: 1000
  storage:
    pending-uploads-dir: ${PENDING_UPLOADS_DIR:/tmp/finance-ai-pending-uploads}

# NOTE: rate limiting for /api/chat/** is NOT configured here — it's built from
# Java RateLimiterConfig beans (see RateLimiterConfigBeans) and applied dynamically
# per client key in ChatRateLimitInterceptor, not via resilience4j.ratelimiter.* YAML.
resilience4j:
  timelimiter:
    instances:
      llmService:
        timeout-duration: 15s
        cancel-running-future: true
      ragChatService:
        timeout-duration: 20s
        cancel-running-future: true
  circuitbreaker:
    instances:
      llmService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: 12s
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
      ragChatService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: 15s
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: false   # was true — avoid leaking environment values via /actuator/info
  health:
    circuitbreakers:
      enabled: true