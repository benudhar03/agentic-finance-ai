services:
  kafka:
    image: apache/kafka:4.1.2
    container_name: finance-ai-kafka
    restart: unless-stopped
    ports:
      # Host-reachable listener, e.g. for a local kafka-ui, kcat, or debugging from your machine.
      - "9092:9092"
    environment:
      # --- KRaft (no Zookeeper) — single-node combined broker+controller ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@finance-ai-kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # --- Listeners ---
      # PLAINTEXT      -> used by other containers on the compose network (e.g. the app service)
      # PLAINTEXT_HOST -> used when connecting from the host machine (localhost:9092)
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://finance-ai-kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # --- Single-node dev sensible defaults ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # false: topics are created explicitly by kafka-init below, with real
      # retention settings — a typo'd topic name now fails loudly instead of
      # silently auto-creating an unmanaged topic with default 7-day retention.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  # One-shot job: creates document-uploaded and document-uploaded.DLT with
  # explicit retention policies, then exits. Shows "Exited (0)" in `docker
  # compose ps` afterward — that's success, not a failure.
  kafka-init:
    image: apache/kafka:4.1.2
    container_name: finance-ai-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server finance-ai-kafka:29092 \
          --create --if-not-exists \
          --topic document-uploaded \
          --partitions 3 \
          --replication-factor 1 \
          --config retention.ms=259200000 \
          --config cleanup.policy=delete

        /opt/kafka/bin/kafka-topics.sh --bootstrap-server finance-ai-kafka:29092 \
          --create --if-not-exists \
          --topic document-uploaded.DLT \
          --partitions 3 \
          --replication-factor 1 \
          --config retention.ms=1209600000 \
          --config cleanup.policy=delete

        echo "Topics created."
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finance-ai-service
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      # host.docker.internal resolves to your Windows host machine from inside
      # the container (Docker Desktop feature) — this is how the containerized
      # app reaches the Postgres instance running locally on your machine.
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/finance
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: finance-ai-kafka:29092
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      AUDIT_ENCRYPTION_KEY: ${AUDIT_ENCRYPTION_KEY}
    ports:
      - "9090:9090"
    extra_hosts:
      # Belt-and-suspenders: guarantees host.docker.internal resolves even on
      # Linux Docker Engine setups where it isn't automatic (Docker Desktop
      # on Windows/Mac already provides this, but this line is harmless either way).
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: finance-ai-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: finance-ai-kafka:29092
    ports:
      - "8089:8080"

volumes:
  kafka-data: